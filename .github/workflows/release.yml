name: Release

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

env:
  BASE_VERSION: v0.0.1

jobs:
  release:
    name: Publish Release
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
      queue: max
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Compute Version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin

          EXISTING_TAG="$(git tag --points-at "$RELEASE_SHA" -l "${BASE_VERSION%.*}.*" --sort=-v:refname |
            awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found++ { print }')"
          if [[ -n "$EXISTING_TAG" ]]; then
            echo "next=${EXISTING_TAG}" >> "$GITHUB_OUTPUT"
            echo "create_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG="$(git tag -l "${BASE_VERSION%.*}.*" --sort=-v:refname |
            awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ && !found++ { print }')"
          if [[ -z "$LAST_TAG" ]]; then
            NEXT_TAG="${BASE_VERSION}"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<<"${LAST_TAG#v}"
            PATCH=$((PATCH+1))
            NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/${NEXT_TAG}")"
          if [[ -n "$REMOTE_TAG" ]]; then
            echo "Tag ${NEXT_TAG} already exists on remote. Exiting to avoid mismatch."
            exit 1
          fi

          echo "next=${NEXT_TAG}" >> "$GITHUB_OUTPUT"
          echo "create_tag=true" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$RELEASE_SHA"
          git push origin "refs/tags/${TAG}"

      - name: Create GitHub release
        env:
          TAG: ${{ steps.version.outputs.next }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists."
            exit 0
          fi

          gh release create "$TAG" \
            --verify-tag \
            --latest \
            --generate-notes \
            --title "$TAG"
